name: Core checks
on:
  push:
  pull_request:
jobs:
  banking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run bank logic tests
        run: node --test web/tests/banking-core.test.js
