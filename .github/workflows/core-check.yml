name: Source and repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test banking and validate web JavaScript
        shell: bash
        run: |
          npm --prefix web test
          node --check web/server.js
          for file in web/lib/*.js web/public/js/*.js web/scripts/*.js; do
            node --check "$file"
          done
      - name: Check Python applications and helper
        run: python -m py_compile tools/prepare_openrp.py apps/admin-software/*.py apps/launcher/*.py
      - name: Test Python helpers and documentation links
        run: python -m unittest discover -s tools/tests -v
      - name: Enforce clean repository structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          required = [
            'game/gamemodes/varkenza.pwn', 'game/config.example.json',
            'web/package.json', 'web/server.js', 'web/.env.example',
            'apps/admin-software/admin_console.py', 'apps/launcher/launcher.py',
            'scripts/windows/START_WEBSITE_WINDOWS.bat', 'assets/branding/logo.png',
            '.gitmodules', 'OPENRP_LICENSE',
          ]
          for path in required:
            assert Path(path).is_file(), f'Missing source: {path}'
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          secret_names = {'.env', 'mysql.ini', 'server.cfg', 'varkenza-bridge.cfg'}
          forbidden = [p for p in tracked if (
            p.startswith('web/data/') or p.endswith(('.sqlite3', '.sqlite3-shm', '.sqlite3-wal', '.pyc', '.amx'))
            or p.split('/')[-1] in secret_names
          )]
          assert not forbidden, f'Private or generated files tracked: {forbidden}'
          assert not any(p.startswith('Файлы/') or p.startswith('Оформление/') for p in tracked), 'Old directories still tracked'
          print('Clean source structure verified.')
          PY
